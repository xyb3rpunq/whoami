/* self-contained on purpose: GitHub Pages serves this file for any missing

:root{
  --bg:#05060a;--ink:#eef1f7;--ink-2:#a8b0c2;--ink-3:#6f7891;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --grad:linear-gradient(100deg,#22d3ee,#8b5cf6 55%,#e879f9);
  --sans:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"SF Pro Display",Inter,Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:2rem;text-align:center;
     background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;
     -webkit-font-smoothing:antialiased}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;z-index:0}
.b1{width:46vw;height:46vw;left:-12vw;top:-10vw;background:radial-gradient(circle,rgba(34,211,238,.42),transparent 68%)}
.b2{width:52vw;height:52vw;right:-16vw;bottom:-14vw;background:radial-gradient(circle,rgba(139,92,246,.38),transparent 68%)}
.card{position:relative;z-index:1;max-width:34rem}
img{width:84px;height:84px;border-radius:50%;margin:0 auto 1.5rem;display:block;
    border:1px solid var(--line-2);background:#0b0e16}
.code{font-family:var(--mono);font-size:clamp(4rem,17vw,8.5rem);font-weight:800;letter-spacing:-.05em;line-height:1;
      margin:0 0 .4rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(1.25rem,4vw,1.85rem);letter-spacing:-.03em;margin:0 0 .7rem}
p{color:var(--ink-2);margin:0 auto 2rem;max-width:34ch}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
     color:var(--ink-3);margin-bottom:1.4rem}
a.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.3rem;border-radius:13px;
      background:var(--grad);color:#04121a;font-weight:700;text-decoration:none;
      box-shadow:0 12px 34px -14px rgba(34,211,238,.9);transition:transform .22s ease,box-shadow .22s ease}
a.btn:hover{transform:translateY(-2px);box-shadow:0 18px 42px -14px rgba(34,211,238,1)}
a.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a.btn:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
